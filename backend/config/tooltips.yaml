# Phase 5: One-line explanations for indicators (inline education)
# Display with --explain or in run output
#
# RULE LOGIC (tied to config score/regime):
# - LT score >= buy_min (70) and regime UP -> HOLD/ADD for medium/long
# - LT score 40-70 -> HOLD/NEUTRAL
# - LT score < sell_max (30) or regime DOWN -> CONSIDER TRIM / AVOID NEW
# - Earnings <= 5 days -> append "Earnings in X days – consider waiting"

# Time horizons for short/medium/long
short_term: "~1 month (2–4 weeks); MA20 vs MA50 + RSI; tactical entry/exit"
medium_term: "~3–6 months; composite score (MA50/200, RSI, MACD); main swing signal"
long_term: "1–2 years; price vs MA200, trend alignment; position bias"

composite_buy: "0-100 score from trend (MA50/200), RSI, MACD; higher = stronger setup"
trend_score: "Price vs MA50 vs MA200; 100 = strong uptrend, 0 = strong downtrend"
rsi: "14-day RSI; >70 overbought, <30 oversold"
macd_hist: "MACD histogram; positive = bullish momentum, negative = bearish"
ma20: "20-day moving average; short-term trend"
ma50: "50-day moving average; medium-term trend"
ma200: "200-day moving average; long-term trend"
regime: "UP (score>=60), NEUTRAL, DOWN (score<=40)"
regime_plain_english:
  UP: "Trend and momentum support the position; model favors holding or adding on pullbacks."
  NEUTRAL: "Mixed signals; hold existing position, avoid large new adds until clarity."
  DOWN: "Weak trend or momentum; consider trimming or avoiding new buys; protect capital."
signal: "BUY (score>=70), HOLD, SELL (score<=30). With ML model: see ml_signal."
# When ML short-term probability is available, signals use confluence + ML tiers (regime.get_ml_aware_signal)
ml_signal: "STRONG BUY = confluence ≥ ml_strong_buy_confluence and ML ≥ strong_buy_ml (alias: ml_strong_buy_prob). BUY = confluence ≥ buy_min and ML ≥ buy_ml (alias: ml_buy_prob). WATCH = good confluence but ML below buy_ml. REDUCE/AVOID when confluence ≤ sell_max or ML below avoid_ml (alias: ml_avoid_max_prob). Thresholds live in config score.* — one source of truth."
strong_buy_ml: "Probability gate for STRONG BUY (config score.strong_buy_ml; defaults to ml_strong_buy_prob)"
buy_ml: "Probability gate for BUY tier (config score.buy_ml; defaults to ml_buy_prob)"
avoid_ml: "ML floor for trim/avoid routing (config score.avoid_ml; defaults to ml_avoid_max_prob)"
earnings_note: "Reduce confidence or avoid trading near earnings"
thesis: "Why you own it; review when regime/score changes"
exit_condition: "When to trim or sell; model nudges when conditions match"
suggested_buy_price: "MA50 (add on pullback) or MA200 (value); consider buying near this level. Omitted when in sell mode (RSI≥70 or score≤35) so we don't encourage adds while suggesting trim/exit"
suggested_sell_price: "Consider trim/exit when overbought (RSI≥70) or score weak (≤35); only when actionable"
buy_target_confidence_pct: "0-100: how much the model supports adding at the buy target; based on composite score (trend/RSI/MACD). Higher = stronger setup for buying at that level"
sell_target_confidence_pct: "0-100: how much the model supports trimming at the sell target; higher when RSI very overbought or score very weak. Use with price to decide sell timing"
support_level: "MA20 support; break below = caution (not a sell price)"

# Price-target accuracy (dashboard section)
st_target_err_pct: "|close − short-term target| / close. ≤5% = good; 5–10% = amber; >10% = consider tweak for that ticker"
support_err_pct: "|close − MA20| / close. MA20 lags; ≤5% good, >10% common in fast moves"
mape_pct: "Mean absolute % error across tickers for this level. Lower = model tracks close better. ≤5–8% = acceptable; >8% ST = consider ATR tweak"
accuracy_acceptable: "No tweak: ST target err ≤5% per ticker, MAPE ≤5–8%. Tweak: ST MAPE >8% or many tickers with err >10%"

# Macro / breadth
breadth_rsp_spy: "RSP (equal-weight S&P) vs SPY ratio + trend — participation proxy for rotation risk with XLK/QQQ leadership."
cross_asset_sensitivity: "60d return correlation vs GLD, UUP (~USD), ^VIX; |ρ|≥0.25 surfaces gold / USD / volatility sensitivity badges on ticker detail."