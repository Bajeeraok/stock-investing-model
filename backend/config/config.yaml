# Opportunity scan: identify tickers with long-term growth potential (daily)
# Set run_opportunity_scan: false to skip in run_daily.py only.
# opportunities_bundle_enabled: false skips lazy UI scan + hides Daily Opportunities section.
run_opportunity_scan: true
opportunities_bundle_enabled: false
opportunity_universe: []   # Empty = use built-in list (~55 liquid S&P leaders)
# Or add your own: [AAPL, MSFT, ...]; combine with watchlist for discovery
opportunity_criteria:
  min_score: 80           # Composite score >= this (spec: 80)
  min_rsi: 50             # RSI >= this (spec: 50–70 sweet spot)
  max_rsi: 70             # Exclude overbought (RSI <= this)
  require_regime_up: true # Must be UP (or UP-HV when use_spec_regime_score)
  min_macd_hist: 0        # Require MACD histogram >= 0 (momentum positive)
  max_results: 25         # Cap output list
  # min_volume_ratio: 0.5  # Exclude when volume < 50% of 20d avg (default 0.5)
  # exclude_earnings_days: 5  # Exclude when earnings in next N days (needs FMP)

# Long-term horizon entry: Tier 2 band uses MOS % from fair value by asset quality (see horizon_entry_calculator).
# Classify known tickers into buckets; unknowns use fundamentals_score (e.g. <45 → speculative).
# Override any class % here; optional tier2_mos_pct_by_ticker for per-symbol MOS without code changes.
horizons:
  tier2_mos_pct:
    high_quality_defensive: 10
    large_cap_growth: 15
    high_volatility: 25
    speculative: 30
  # Optional per-ticker Tier 2 MOS % (overrides class), e.g. BLK: 12
  tier2_mos_pct_by_ticker: {}

# Trim gates (exit stack — parallel to buy gates; hybrid v1: 2/4 pass + score trigger)
trim_gates:
  enabled: true
  min_pass: 2
  require_score_trigger: true
  extension_rsi_min: 65
  extension_above_ma20_pct: 3.0
  regime_bull_max: 45
  pattern_weak_max: 40
  ml_bear_max_pct: 35
  macd_hist_bear_max: 0.0

# Paper trading panel: summary thresholds + benchmark column (same-date window as each trade)
paper_trading:
  min_completed_for_summary: 60   # lower (e.g. 15) to unlock full stats sooner while building history
  min_actionable_buy_summary: 8   # min completed STRONG BUY/BUY/HOLD/ADD rows for buy-only sub-summary
  backfill_from_eod_days: 90      # rebuild paper_trades.csv from EOD when CSV is empty/stale after redeploy
  require_gates_cleared: true     # only log GO signals (all 4 gates pass); legacy EOD without gates still backfills
  entry_mode: limit_touch          # limit_touch (patient limit at reference) | market (legacy close fill)
  reference_entry: st_band_low           # st_band_low (ST ATR/swing) | suggested_buy_price (MA50/200) | support_level
  limit_max_wait_days: 10         # business days after GO signal to wait for limit touch
  require_actionable_signal: true # BUY / STRONG BUY / HOLD-ADD only (skip GO+HOLD rows)
  benchmark_ticker: SPY
  execution:
    mode: next_session            # close_to_close (legacy) | next_session (more realistic fills)
    round_trip_cost_pct: 0.003    # commission+slippage total; applied half on entry, half on exit
    use_intraday_touch: true      # if snapshot row has high/low, use them for target/stop hit checks

# Swing setup track (technical-first) — parallel to accumulate GO; does NOT replace 4-gate path
swing_tactical:
  enabled: true
  min_swing_score: 70              # matches classifier SWING_SIGNAL threshold
  require_swing_signal_verdict: true
  log_paper_trades: false          # enable after backtest_swing_setups.py looks good
  dedup_window_days: 5

# Velocity / tactical breakout track (P0) — does NOT change primary 4-gate GO
velocity_tactical:
  enabled: true
  rvol_min: 2.0                 # today's volume vs 20d avg
  bb_pct_b_min: 1.0             # at/above upper Bollinger band
  bb_pct_b_extended: 0.85
  min_velocity_score: 55        # 0–100 composite; requires rvol OR bb break when require_rvol_or_bb true
  horizon_trading_days: 5
  require_rvol_or_bb: true
  log_paper_trades: true
  require_buy_side_for_paper: true   # skip REDUCE/TRIM/SELL velocity rows (long-only paper)
  min_gates_for_paper: 0            # set 2 to align with tactical_min_gates_for_alert
  tactical_min_gates_for_alert: 2

# Scout overview: 1-day event risk strip (earnings + ATR + velocity ranking)
event_risk_strip:
  enabled: true
  max_earnings_days: 14
  max_lookback_days: 21
  limit: 8
  min_score: 12.0

# Forward audit pilot: fixed 100-ticker cohort → SQLite at DATA_ROOT/signal_audit.db
# Cohort list lives in config/signal_audit_cohort.yaml (separate from watchlist/portfolio).
# Outcomes (Phase 2) read EOD from Redis first, then DATA_ROOT/eod/ — same as paper trades.
signal_audit:
  enabled: true
  cohort_file: config/signal_audit_cohort.yaml
  merge_into_signal_universe: true       # audit cohort on EOD/run_daily only (not dashboard refresh)
  use_cohort_for_forward_tracking: false       # forward tracking = your book; audit panel = cohort
  log_on_run_daily: true
  log_on_dashboard: false   # full cohort (~97/100) only from run_daily / EOD scheduler — not dashboard refresh (~25/100)
  min_cohort_capture_ratio: 0.90   # skip audit log when run has fewer than 90% of cohort tickers present
  pilot_target_days: 30
  resolve_outcomes_on_read: true   # Analysis tab auto-resolves when enough EOD history exists
  outcomes:
    enabled: true
    horizon_trading_days: [7, 20]   # maps to return_7d_pct / return_30d_pct columns (~1w / ~1mo)
    use_intraday_touch: true
    benchmark_ticker: SPY
    win_return_pct: 3.0
    loss_return_pct: -3.0
    false_negative_pct: 5.0
    tactical_horizon_trading_days: 5
    tactical_win_return_pct: 1.5
    tactical_loss_return_pct: -1.5
  report:
    enabled: true
    output_dir: reports
    summary_filename: audit_summary.json
    export_filename: signal_audit_export.csv
    resolve_before_build: true

# Retail trading-gate thresholds (retail_action_payload.py). Do not lower valuation_full_mos_pct
# below 25 for full GO — starter_only covers 15–25% MOS when tech gates fail.
retail_gates:
  regime_bull_pct_min: 60
  valuation_full_mos_pct: 25
  valuation_partial_mos_pct: 15
  ml_short_prob_min: 25
  momentum_rsi_max: 50
  momentum_pattern_min: 45

# Forward tracking panel (Analysis tab)
forward_tracking:
  max_pairs_per_horizon: 60              # snapshot-step pairs per horizon (raise if cohort is large)
  max_records_response: 2000             # most recent rows returned to UI
  require_gates_cleared: false           # keep all rows; gate fields on each record for filtering
  enrich_gates_from_eod: true            # recompute gates when snapshot lacks gates_frozen
  use_intraday_touch: true               # ST stop/target use EOD high/low between as-of and forward date

# 7-layer confidence: HMM bear penalty vs MA200 trend conflict; ML prob calibration (Platt / isotonic)
# Standard equity weights: see pre_flight/constants.py (EQUITY_US — fundamentals 14%, regime 11%).
# Roadmap (staged prices) uses MA/analyst/scenario logic; confidence is a multi-layer nowcast — they can diverge by design.
# HMM penalty frequency: scripts/audit_hmm_bear_penalty.py; API returns penalty_audit.
confidence:
  # Action labels for 7-layer confidence — align with model_rules add/trim (add_min_confidence / trim_max_confidence) when omitted
  action_thresholds:
    strong_buy: 0.80
    buy: 0.70
    hold: 0.45
    reduce: 0.30
  # options_pc_mode: contrarian | directional | auto (auto = directional when HMM bear > 55%, else contrarian)
  options_pc_mode: auto
  # Asset-aware options narrative thresholds for UI wording consistency.
  options_narrative:
    equity:
      constructive_max: 0.65
      complacency_from: 0.50
      weak_score_threshold_pct: 45
    commodity_etf:
      constructive_max: 0.70
  # Reconciliation tuning for structural-vs-tactical messaging in ticker detail.
  reconciliation:
    fused_cautious_max_pct: 40
    long_horizon_strong_min_pct: 80
    transition_uncertain_shift_min: 0.70
    pre_flip_shift_prob_min: 0.85
    pre_flip_bull_share_min: 0.55
    pre_flip_window_days: 10
    options_constructive_min_pct: 55
    options_constructive_pc_max: 0.70
  ml_short_horizon:
    shrink_neutral_band: true       # pull 20d ML prob toward 50% when in dead zone (sideways tape)
    neutral_low: 0.38
    neutral_high: 0.58
    neutral_pull_to_50_factor: 0.55
  regime_blend:
    soften_bear_when_above_ma200: true
    bear_penalty_mult: 0.46           # was 0.40 — slightly less harsh before ease
    bear_penalty_mult_above_ma200: 0.76  # was 0.72
    bear_penalty_ease_toward_one: 0.18   # pull multipliers toward 1.0 to limit stacked HMM leverage
  # When HMM bear or bull ≥ threshold, reduce news layer weight and add the rest to regime_hmm
  # mode: fraction — multiply news weight by news_weight_fraction | taper — linear taper to news_weight_floor
  extreme_regime_news:
    enabled: true
    certainty_threshold: 0.90
    mode: fraction
    news_weight_fraction: 0.35      # used when mode=fraction
    news_weight_floor: 0.05         # used when mode=taper (see signals/news_weight_cap.py)
  calibration:
    enabled: false                        # set true after running scripts/fit_probability_calibration.py
    path: data/calibration/ml_horizons.json  # relative to backend/

# Unified evaluation: scripts/run_evaluation_harness.py — rows per (ticker, date) + fwd returns + baselines
evaluation:
  horizons_trading_days: [21, 63, 126, 252]  # ~1m / ~3m / ~6m / ~12m; compare to ML horizons 20/60/120 in code
  default_step: 5
  spy_ticker: SPY
  # Primary gates on walk-forward panel (scripts/backtest_gates.py, run_evaluation_harness.py)
  gate_backtest:
    enabled: true
    predict_ml: false          # true = LightGBM inference per bar (slow; enables ML gate)
    include_confidence_gate: false  # live UI uses 4 gates; set true for 5th confidence gate

# Fair value — SPY uses earnings-yield (rf+ERP) on ETF EPS; single names use fair_value_estimator multi-method
fair_value:
  use_earnings_yield_for_spy: true
  risk_free_rate: 0.043        # 10Y Treasury (decimal); optional: wire live from FRED
  equity_risk_premium: 0.045   # large-cap ERP; ~3.5–5% common — affects implied P/E = 1/(rf+ERP)
  # Caps keep displayed FV near Street + spot (retail-safe). For forecast-accuracy research / backtests,
  # set analyst_mean_cap_enabled: false and max_implied_upside_vs_spot: null so FV reflects the raw multi-method estimate.
  sector_pe_default: 28.0              # RV strip reference when sector ETF PE unavailable
  guardrails:
    analyst_mean_cap_enabled: true
    analyst_mean_cap_mult: 1.10          # max FV = street anchor (FMP median, else Yahoo) × this
    max_implied_upside_vs_spot: 0.52     # max implied upside vs spot; use null to disable
    max_growth_pct_for_valuation: 42.0   # GROWTH peg_blend cap (YoY from feeds)
    max_growth_pct_high_growth: 65.0     # HIGH_GROWTH forward_pe_blend PEG leg (NVDA-class)
    street_blend_trigger_below_pct: 0.20  # blend when model FV >20% below street (HIGH_GROWTH)
    street_blend_trigger_above_pct: 0.12  # blend when model FV >12% above street (all types)
    street_blend_weight: 0.55             # weight on analyst mean when model below street
    street_blend_above_weight: 0.45      # weight on analyst mean when model above street
    street_floor_min_pct: 0.72           # never show HIGH_GROWTH FV below 72% of street

# Phase 4: Data & earnings
# See docs/data/DATA_SOURCES.md and docs/data/DATA_CONTRACT.md for FMP+FRED endpoint → module mapping
data:
  # When FMP batch quotes are on, overwrite SPY/QQQ/DIA/IWM with Yahoo last close so dashboard marks match OHLCV vendor.
  # Set false to keep FMP as primary quote source (including index ETFs).
  yahoo_overlay_index_etf_quotes: false
  period: 5y         # Live signals, indicators, ATR, vol, MA (short-term); keep 5y for responsiveness
  period_long: 20y   # What-if only: event scenarios (FOMC/CPI reaction stats); NOT used for live signals
  period_long_risk: 20y   # Long-horizon risk: max drawdown, stress bear, worst 3y (monthly data; 2007-present = 2008 crisis included)
  use_fmp_batch_quote: false  # FMP /quote batch endpoint requires Premium ($59/mo) — 402 on Starter.
                              # Signals still use FMP historical OHLCV as primary (Starter supported).
                              # Live price marks fall back to yfinance batch (one call, ~5s for 100+ tickers).
  # Set via environment (FMP_API_KEY, FRED_API_KEY, …) in production — see config_loader.py. Do not commit real keys.
  #fmp_api_key: "6aRwanR4sXBzOicYLIHXIeIutlaTpmZz"
  #fred_api_key: "35b8f3e904ea9e4fdb6f2b7a67622cc6"
  tradingeconomics_api_key: ""       # TradingEconomics – economic calendar (placeholder)
  #alpha_vantage_api_key: "VH0UTQUCKJWIXI3U"
  benzinga_api_key: ""               # Benzinga – news, options flow (placeholder)
  etf_flows_api_key: ""
  #polygon_api_key: "2XVRQvFBQ48Ozvglzc6uqjP7XHuxpKtv"
  #finnhub_apikey: "d61pbp1r01qgcobqd3dgd61pbp1r01qgcobqd3e0"
             # ETF flows (SPY, QQQ, GLD) – placeholder; systematic feeds usually paid
earnings:
  days_warning: 14  # Flag when earnings within N days
  score_reduction: 20  # Reduce score by this when within days_warning
  caution_days: 7  # Stronger UI flag + extra reduction below
  caution_extra_reduction: 5  # Additional composite reduction when within caution_days (on top of score_reduction)

# Dashboard-only: FMP earnings quality on top signal rows (grade + flags)
dashboard_earnings_quality:
  enabled: true
  max_tickers: 12

# Thrive Alpha Phase 2 (signals/thrive_phase2): intraday setup, FMP fundamentals gate, ATR targets, 1m hit gate
thrive_phase2:
  min_hit_rate_1m: 0.65   # ShortTermBacktester trusted if hit rate ≥ this and N≥20
  bull_baseline_error: 0.0061       # bear_dampening: MoE baseline (bull calibration)
  observed_bear_error_band: 0.0538   # raise above baseline when bear-year MoE is wider (enables dampening)
  # atr_config:  # optional per-setup multipliers after live validation

# Phase 4: Backtest (run from backend: python scripts/backtest_simple.py)
# Dashboard default story: validate dip entries (MR-aware buckets, emphasize 6m in UI) — not raw-momentum-only.
# Dashboard "Backtesting status" section uses GLD, QQQ, SPY with backtest_period
backtest_tickers: [SPY, QQQ, GLD, XLE, XLF, IWM]
# SPY/QQQ/GLD: core ETFs | XLE: energy (rough 2014-16, 2020) | XLF: financials (rough 2008) | IWM: small caps (tougher regime than SPY)
# Broader mix tests whether the signal holds across sectors, not just survivorship-biased winners.

# Round-trip transaction cost for backtests (commission + slippage, as fraction)
backtest_transaction_cost: 0.003  # 0.30% = ~0.10% commission + 0.05% slippage each way
backtest_period: 20y   # Years of history for backtest (2007-present; covers 2008-09 crisis, 2020, 2022)

# ── ML model training configuration ─────────────────────────────────────────
ml_models:
  enabled: true                  # Set false to skip ML layer entirely (uses rule-based only)
  retrain_interval_days: 7       # Retrain weekly (checks model file age at run time)
  hmm_period: 2y                 # HMM only needs 2 years to identify 3 regime fingerprints
  # LightGBM training periods by ticker group:
  #   Stable ETFs / large-caps:   20y  (2007-present: 2008 crisis, 2018, 2020, 2022 all included)
  #   Growth / momentum stocks:   5y   (pre-2019 behaviour is structurally different)
  #   Volatile / newer listings:  3y   (older data teaches wrong patterns)
  lgbm_period_default: 5y
  lgbm_period_overrides:
    # 20y = 2007-present: captures 2008-09 financial crisis + all modern regimes
    SPY:   20y
    QQQ:   20y   # QQQ exists since 1999; 20y gives us 2007 onward
    GLD:   20y   # GLD launched Nov 2004; 20y gives full available history
    SLV:   20y   # SLV launched Apr 2006
    IWM:   20y
    XLE:   20y   # Energy: 2008 oil spike + 2014-16 bust + 2020 crash all included
    XLF:   20y   # Financials: 2008 crisis is THE most important event for this sector
    AAPL:  20y
    MSFT:  20y
    GOOGL: 20y
    AMZN:  20y
    # Growth/momentum: pre-2019 behaviour is structurally different; keep at 5y
    TSLA:  5y
    NVDA:  5y
    META:  5y    # IPO 2012; could use 10y but pre-2018 Meta is a different company
    AMD:   5y
    AVGO:  5y
    LLY:   5y
    # Newer / structural-change tickers: short history is more relevant
    BABA:  3y
    CRSP:  3y
    ASAN:  3y

# Phase 5: Thesis & behavior
behavior:
  cooldown_days_after_trim: 14
  journal_max_entries: 200

dashboard_catalysts:
  enabled: true
  max_tickers: 17

run_thesis_check: true
run_what_changed: true
show_tooltips: false  # Set true to print indicator explanations at end

# EOD snapshots: run_daily.py saves daily results to data/eod/YYYY-MM-DD.json
# for historical tracking, forward tracking, and backtesting.
# Keep all snapshots (0) recommended so you can use them later; set to e.g. 365 to purge older than 1 year.
eod_retention_days: 0   # 0 = keep forever; set 90/365 etc. to purge older snapshots

# Corporate actions — EOD closes are not retro-adjusted; forward metrics scale pre-split prices.
# ratio = N for N-for-1 split (price ÷ N on effective_date).
stock_splits:
  CRWD:
    - effective_date: "2026-07-02"
      ratio: 4

# Income Book — ad-hoc swing sleeve (separate from long-term portfolio holdings).
income_book:
  enabled: true
  exclude_long_term_holdings: true   # scan ~100 universe minus thesis portfolio
  min_swing_score: 65
  min_gates_passed: 3
  max_proposed_slots: 8
  max_open_trades: 3                 # user can override in UI settings
  candidate_pool_size: 30
  block_new_entries_regime_down: true
# Python scheduler (scripts/scheduler_eod.py): run EOD snapshot daily at this time
# In-process APScheduler (uvicorn / Docker) uses the same keys when EOD_SCHEDULER_CRON is unset.
# Skips weekends and NYSE full-day holidays (Independence Day observed, Good Friday, etc.).
eod_schedule_time: "20:00"   # 8pm ET, Mon–Fri (non-holiday)
eod_schedule_tz: "America/New_York"
# eod_scheduler_enabled: false   # set to disable in-process EOD without env vars

# Crypto section (BTC, ETH) - same signals as equities
crypto_watchlist:
  - BTC-USD
  - ETH-USD

# Cross-asset (DXY=USD, GLD=gold, USO=oil, VIX) - daily % change
cross_asset_tickers:
  - DX-Y.NYB
  - GLD
  - USO
  - SLV
  - "^VIX"

# Pre-IPO / private names — reference panel (not tradable; valuations manually maintained)
pre_ipo_watchlist:
  enabled: true
  disclaimer: "Reference only — not tradable in this app. Valuations from public sources; update valuation_as_of when funding rounds print."
  companies:
    - id: spacex
      name: SpaceX
      sector: Aerospace
      last_valuation_usd_b: 350
      valuation_as_of: "2024-12"
      status: private
      note: "No public ticker. Watch launch cadence and defense/space read-through."
      public_proxies: [RKLB, BA]
      news_keywords: [SpaceX, Starship, Starlink]
    - id: openai
      name: OpenAI
      sector: AI
      last_valuation_usd_b: 157
      valuation_as_of: "2024-10"
      status: private
      note: "Structurally private; MSFT/NVDA often used as AI-cycle proxies."
      public_proxies: [MSFT, NVDA]
      news_keywords: [OpenAI, ChatGPT, "Sam Altman"]
    - id: anthropic
      name: Anthropic
      sector: AI
      last_valuation_usd_b: 61.5
      valuation_as_of: "2025-03"
      status: private
      note: "Google/Amazon-backed; no direct equity access for most retail."
      public_proxies: [GOOGL, AMZN]
      news_keywords: [Anthropic, Claude]
  fetch_news: true
  news_limit: 100

# Tax-aware exit optimizer: flag positions approaching 1-year (LTCG) threshold
# Add purchase_date (YYYY-MM-DD) to holdings in config or Excel upload to enable
# taxable_accounts: only show suggestions for these (e.g. Taxable); omit to include all
# Rates: federal + state (e.g. SC 7%). Short-term = ordinary income; long-term = cap gains
tax_aware_exit:
  taxable_accounts: ["Taxable"]   # or null to include all accounts
  st_fed_pct: 32
  st_state_pct: 7
  lt_fed_pct: 15
  lt_state_pct: 7
  approaching_days: 90   # flag when this many days or fewer until LTCG
