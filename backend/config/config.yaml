# Spec mode: MA-based regime (UP/UP-HV/DOWN/SIDE) + TS/MOM zscore composite score
# When true: regime from price vs MA50 vs MA200 + vol; score = 0.35*TS + 0.30*MOM + 0.20*VAL + 0.15*QLT - 15 if regime not UP/UP-HV
use_spec_regime_score: false   # set true to use spec formula (MA regime + zscore TS/MOM)
use_spec_val_qlt: true         # when use_spec_regime_score, add VAL (forward PE vs SPY) and QLT (roe, margin, leverage) for stocks

# Global market regime (5-level: STRONG_BULL, BULL, NEUTRAL, BEAR, STRONG_BEAR)
# Regime multipliers adjust scores; VIX overlay amplifies when calm, suppresses when elevated.
market_regime:
  enabled: true
  index_ticker: SPY
  min_days_confirm: 3          # require N consecutive days above/below MA200 to reduce whipsaws
  use_vix_multiplier: true     # apply VIX overlay (calm 1.1x, elevated 0.8x, high 0.5x, extreme 0.2x)
  use_hit_rate_gate: true      # suppress BUY/ADD when ADD hit rate < VIX-based threshold (VIX >= 20)

# Overbought penalty: cuts 70-100 signals when RSI high + price extended above MA200
overbought_penalty:
  enabled: true
  rsi_70_penalty: 5            # RSI > 70
  rsi_80_penalty: 5            # RSI > 80 (additional)
  extension_20_penalty: 5      # price > 20% above MA200
  extension_35_penalty: 5      # price > 35% above MA200 (additional)

# Score bands (0-100): BUY >= buy_min, SELL <= sell_max, else HOLD
# Rule logic: score >= buy_min + regime UP -> HOLD/ADD; score <= sell_max -> CONSIDER TRIM
# ML-aware signal tiers (when ML short-term prob available): STRONG BUY / BUY / WATCH / REDUCE / AVOID
score:
  buy_min: 70
  # Per-ticker BUY threshold overrides (backtest calibration; global buy_min applies if omitted)
  buy_min_by_ticker:
    NVDA: 40
    QQQ: 50
    SPY: 50
  sell_max: 30
  ml_strong_buy_confluence: 72   # confluence >= this AND ml prob >= ml_strong_buy_prob -> STRONG BUY
  ml_strong_buy_prob: 0.55       # ML prob (0-1) for STRONG BUY
  ml_buy_prob: 0.40              # ML prob for BUY; below this but confluence ok -> WATCH
  ml_avoid_max_prob: 0.20        # ML prob below this -> REDUCE or AVOID
  # Mean-reverting tape: momentum scores can invert vs forward returns. When enabled, we only
  # flip threshold mapping (100 - confluence for signals); raw composite_buy is unchanged.
  interpretation:
    enabled: true
    # Backtest bucket table: align with MR tape (use 100−score for bucket when ACF says mean-reverting)
    apply_to_backtest_buckets: true
    # Backtest-only: lag-1 ACF ≤ this → MR bucket mapping (0 = any negative autocorr). Live uses acf_mean_reversion_max.
    acf_mean_reversion_max_backtest: 0.0
    # Backtest-only: neutral ACF band (between MR and trend) treated as chop → MR buckets (recommended)
    backtest_neutral_chop_as_mr: true
    # Set true to force 100−score for every bar (debug); prefer settings above
    backtest_force_invert_buckets: false
    acf_window: 126              # trading days for lag-1 autocorr of daily returns
    acf_mean_reversion_max: -0.028  # at or below → classify MEAN_REVERTING (live)
    acf_trend_min: 0.04           # above → TRENDING; between → TRENDING (neutral) for live
    min_bars: 130
    force_trending: []            # e.g. [SPY] to never invert thresholds for an index
    force_mean_reverting:
      - MSFT   # backtest: contrarian tape — buy weakness, avoid strength

# Regime bands: UP >= up_min, DOWN <= down_max, else NEUTRAL
regime:
  up_min: 60
  down_max: 40

# Alert when score moves by this much (points)
alert_score_delta: 15

# Concentration: alert if any single position > this % of portfolio
concentration_alert_pct: 20

# Cash deployment: suggest watchlist tickers not in portfolio with score >= this
cash_deploy_min_score: 70

# Model rules (single source for dashboard + tooltips): add when confidence >= this, trim when <= this
model_rules:
  add_min_confidence: 70    # 7-layer confidence 0-100; "Add only when confidence ≥ 70 and regime UP"
  trim_max_confidence: 30   # Trim when confidence ≤ 30 or regime DOWN
  add_min_regime: UP        # Require regime UP for new adds

# Portfolio Doctor: allocation recommendations (trim/add with $ and prices)
# Uses risk_appetite + goal + target $ over time to tune aggressiveness; suggests trim/add with amounts and prices
portfolio_doctor:
  risk_appetite: aggressive   # conservative | moderate | aggressive
  goal: medium              # short | medium | long
  target_portfolio_value: null   # optional: target $ at future date (e.g. 2000000)
  time_period_years: 10     # 5 | 10 | 15 | 20 when target_portfolio_value is set

# Risk sizing: suggested position size at 1% risk, 10% stop (for Daily Signals tooltip)
risk_sizing:
  risk_pct: 1       # Risk this % of portfolio per trade
  default_stop_pct: 10   # Assume 10% stop loss distance

# Backtest: calibration "OK" when score >= this (used in backtest_simple.py and model health)
backtest:
  calibration_ok_min: 70   # Same as score.buy_min by default; calibration_score >= this = OK

# Price-target accuracy: when to interpret vs when to tweak the model
# Report compares today's close to model levels (ST target, support, suggested buy, MT band).
# err% = 100 * (close - level) / close (absolute value = how far close is from the level).
# MAPE = mean absolute % error across tickers for that level.
accuracy:
  # Per-ticker: ST target err% and Support err% (absolute %)
  # Below these = acceptable; no tweak needed for that ticker.
  st_target_err_acceptable_pct: 5    # Green: err <= 5%; amber 5–10%; red > 10% → consider tweak for volatile names
  support_err_acceptable_pct: 5      # Support (MA20) often lags; err <= 5% good, > 10% expect in fast moves
  # Summary (MAPE across tickers): when to suggest "tweak model"
  st_target_mape_tweak_above: 8       # If ST target MAPE > 8%, recommend adjusting target_bands (ATR mult)
  support_mape_tweak_above: 15        # If support MAPE > 15%, note that MA20 lags (use as watch level only)
  # Optional manual overrides: model auto-adjusts band width by volatility (high-vol tickers get wider bands).
  # Add tickers here only if you want to override (e.g. CRWD: 1.8). Leave empty for auto-adjust only.
  st_target_atr_mult_overrides: {}
  # Interpretation guide (shown in dashboard and script help)
  notes:
    - "ST target err% = |close − short-term target| / close. Low = price near our ST target (good)."
    - "Support err% = |close − MA20| / close. MA20 lags; some error is normal in fast moves."
    - "MAPE = average of absolute % errors across tickers for that level. Lower = model level tracks close better."
    - "Acceptable: ST target err ≤ 5% per ticker, MAPE ≤ 5–8% overall. No tweak needed."
    - "Model auto-adjusts band width by volatility (high-vol tickers get wider bands). No manual ATR config needed."
    - "Support/MA20 is a watch level, not a precise target; high support err often means strong trend, not model bug."
    - "Amber/Tweak tickers: model auto-widens bands for high-volatility names. Manual override optional (st_target_atr_mult_overrides)."

# Retail UI: trade roadmap sell-side alignment (horizon targets + ST/MT/LT bands). All optional — omit to use code defaults.
retail:
  sell_roadmap:
    pad_min_pct_of_spot: 0.01   # min gap between profit-taking ladder steps (fraction of spot)
    pad_floor: 0.05
    short_no_52w_cap_mult: 1.15   # cap vs target when 52w high missing
    short_target_hi_mult: 1.04
    short_st_hi_mult: 0.995       # nudge vs ST band high
    short_target_lo_mult: 0.97
    st_fallback_band_lo_mult: 0.96
    st_fallback_52w_mult: 0.97
    medium_lo_mult: 0.91
    medium_hi_mult: 0.995
    medium_mt_hi_mult: 0.92
    medium_mt_cap_mult: 1.06
    major_medium_lo_mult: 0.98
    major_fv_low_mult: 0.82
    major_fv_hi_mult: 0.92
    full_long_lo_mult: 0.93
    full_fv_lo_mult: 0.93

  # Trade roadmap: auto-fix RC issues; Hurst on ticker detail. Canonical scenario_target overwrites horizons.medium.target (one source of truth).
  roadmap:
    apply_auto_fixes: true
    enable_signal_regime_on_detail: true
  regime_signals:
    precedence_note: "Score bucket thresholds use score.interpretation (ACF) when enabled; Hurst on trade_roadmap is supplementary context."
  signal_diagnostics:
    enabled: true

# Alerts (optional) - leave user/password/from_addr/to_addrs empty to skip; alerts still print to console
# Email (SMTP): fill in your details. For Gmail: enable 2FA, create App Password at myaccount.google.com
alerts:
  # Daily digest: retail = story changes OR trim candidates OR earnings-week holdings; story_only = stories only
  digest_mode: retail
  # Scanner (Level-2): IV rank / flow / premium-selling surfacing — off by default; use band alerts below.
  enable_options_alerts: false
  # Separate process: alerts/worker.py Tradier IV snapshots + IV_EXTREME events (optional)
  enable_options_iv_worker: false
  # Retail: ST/MT/LT buy zone, stop, target hit, "near target — consider trim" (from ticker-detail band cache)
  enable_band_alerts: true
  enable_earnings_alerts: true
  enable_ml_prob_alerts: true
  trim_approach_fraction: 0.95   # trim hint when price >= this fraction of each horizon target (below full target)
  email:
    smtp_host: smtp.gmail.com
    smtp_port: 587
    user: ""                    # e.g. yourname@gmail.com
    password: ""                # Gmail App Password (16 chars)
    from_addr: ""               # e.g. yourname@gmail.com
    to_addrs: []                # e.g. [yourname@gmail.com] or ["a@x.com", "b@x.com"]
# Or use Telegram instead:
# alerts:
#   telegram:
#     bot_token: YOUR_BOT_TOKEN
#     chat_id: YOUR_CHAT_ID

# Opportunity scan: identify tickers with long-term growth potential (daily)
# Set run_opportunity_scan: false to skip (faster run)
run_opportunity_scan: true
opportunity_universe: []   # Empty = use built-in list (~55 liquid S&P leaders)
# Or add your own: [AAPL, MSFT, ...]; combine with watchlist for discovery
opportunity_criteria:
  min_score: 80           # Composite score >= this (spec: 80)
  min_rsi: 50             # RSI >= this (spec: 50–70 sweet spot)
  max_rsi: 70             # Exclude overbought (RSI <= this)
  require_regime_up: true # Must be UP (or UP-HV when use_spec_regime_score)
  min_macd_hist: 0        # Require MACD histogram >= 0 (momentum positive)
  max_results: 25         # Cap output list
  # min_volume_ratio: 0.5  # Exclude when volume < 50% of 20d avg (default 0.5)
  # exclude_earnings_days: 5  # Exclude when earnings in next N days (needs FMP)

# Long-term horizon entry: Tier 2 band uses MOS % from fair value by asset quality (see horizon_entry_calculator).
# Classify known tickers into buckets; unknowns use fundamentals_score (e.g. <45 → speculative).
# Override any class % here; optional tier2_mos_pct_by_ticker for per-symbol MOS without code changes.
horizons:
  tier2_mos_pct:
    high_quality_defensive: 10
    large_cap_growth: 15
    high_volatility: 25
    speculative: 30
  # Optional per-ticker Tier 2 MOS % (overrides class), e.g. BLK: 12
  tier2_mos_pct_by_ticker: {}

# Fair value — SPY uses earnings-yield (rf+ERP) on ETF EPS; single names use fair_value_estimator multi-method
fair_value:
  use_earnings_yield_for_spy: true
  risk_free_rate: 0.043        # 10Y Treasury (decimal); optional: wire live from FRED
  equity_risk_premium: 0.045   # large-cap ERP; ~3.5–5% common — affects implied P/E = 1/(rf+ERP)

# Phase 4: Data & earnings
# See DATA_SOURCES.md and DATA_CONTRACT.md for FMP+FRED endpoint → module mapping
data:
  # When FMP batch quotes are on, overwrite SPY/QQQ/DIA/IWM with Yahoo last close so dashboard marks match OHLCV vendor.
  # Set false to skip extra Yahoo calls and use FMP-only marks for index ETFs.
  yahoo_overlay_index_etf_quotes: true
  period: 5y         # Live signals, indicators, ATR, vol, MA (short-term); keep 5y for responsiveness
  period_long: 20y   # What-if only: event scenarios (FOMC/CPI reaction stats); NOT used for live signals
  period_long_risk: 20y   # Long-horizon risk: max drawdown, stress bear, worst 3y (monthly data; 2007-present = 2008 crisis included)
  use_fmp_batch_quote: false  # Set true when FMP plan includes batch-quote (saves API calls); current plan = per-ticker data
  # Set via environment (FMP_API_KEY, FRED_API_KEY, …) in production — see config_loader.py. Do not commit real keys.
  fmp_api_key: ""
  fred_api_key: ""
  tradingeconomics_api_key: ""       # TradingEconomics – economic calendar (placeholder)
  alpha_vantage_api_key: ""
  benzinga_api_key: ""               # Benzinga – news, options flow (placeholder)
  etf_flows_api_key: ""
  polygon_api_key: ""
  finnhub_apikey: ""
             # ETF flows (SPY, QQQ, GLD) – placeholder; systematic feeds usually paid
earnings:
  days_warning: 14  # Flag when earnings within N days
  score_reduction: 20  # Reduce score by this when within days_warning

# Thrive Alpha Phase 2 (signals/thrive_phase2): intraday setup, FMP fundamentals gate, ATR targets, 1m hit gate
thrive_phase2:
  min_hit_rate_1m: 0.65   # ShortTermBacktester trusted if hit rate ≥ this and N≥20
  bull_baseline_error: 0.0061       # bear_dampening: MoE baseline (bull calibration)
  observed_bear_error_band: 0.0538   # raise above baseline when bear-year MoE is wider (enables dampening)
  # atr_config:  # optional per-setup multipliers after live validation

# Phase 4: Backtest (run from backend: python scripts/backtest_simple.py)
# Dashboard "Backtesting status" section uses GLD, QQQ, SPY with backtest_period
backtest_tickers: [SPY, QQQ, GLD, XLE, XLF, IWM]
# SPY/QQQ/GLD: core ETFs | XLE: energy (rough 2014-16, 2020) | XLF: financials (rough 2008) | IWM: small caps (tougher regime than SPY)
# Broader mix tests whether the signal holds across sectors, not just survivorship-biased winners.

# Round-trip transaction cost for backtests (commission + slippage, as fraction)
backtest_transaction_cost: 0.003  # 0.30% = ~0.10% commission + 0.05% slippage each way
backtest_period: 20y   # Years of history for backtest (2007-present; covers 2008-09 crisis, 2020, 2022)

# ── ML model training configuration ─────────────────────────────────────────
ml_models:
  enabled: true                  # Set false to skip ML layer entirely (uses rule-based only)
  retrain_interval_days: 7       # Retrain weekly (checks model file age at run time)
  hmm_period: 2y                 # HMM only needs 2 years to identify 3 regime fingerprints
  # LightGBM training periods by ticker group:
  #   Stable ETFs / large-caps:   20y  (2007-present: 2008 crisis, 2018, 2020, 2022 all included)
  #   Growth / momentum stocks:   5y   (pre-2019 behaviour is structurally different)
  #   Volatile / newer listings:  3y   (older data teaches wrong patterns)
  lgbm_period_default: 5y
  lgbm_period_overrides:
    # 20y = 2007-present: captures 2008-09 financial crisis + all modern regimes
    SPY:   20y
    QQQ:   20y   # QQQ exists since 1999; 20y gives us 2007 onward
    GLD:   20y   # GLD launched Nov 2004; 20y gives full available history
    SLV:   20y   # SLV launched Apr 2006
    IWM:   20y
    XLE:   20y   # Energy: 2008 oil spike + 2014-16 bust + 2020 crash all included
    XLF:   20y   # Financials: 2008 crisis is THE most important event for this sector
    AAPL:  20y
    MSFT:  20y
    GOOGL: 20y
    AMZN:  20y
    # Growth/momentum: pre-2019 behaviour is structurally different; keep at 5y
    TSLA:  5y
    NVDA:  5y
    META:  5y    # IPO 2012; could use 10y but pre-2018 Meta is a different company
    AMD:   5y
    AVGO:  5y
    LLY:   5y
    # Newer / structural-change tickers: short history is more relevant
    BABA:  3y
    CRSP:  3y
    ASAN:  3y

# Phase 5: Thesis & behavior
run_thesis_check: true
run_what_changed: true
show_tooltips: false  # Set true to print indicator explanations at end

# EOD snapshots: run_daily.py saves daily results to data/eod/YYYY-MM-DD.json
# for historical tracking, forward tracking, and backtesting.
# Keep all snapshots (0) recommended so you can use them later; set to e.g. 365 to purge older than 1 year.
eod_retention_days: 0   # 0 = keep forever; set 90/365 etc. to purge older snapshots
# Python scheduler (scripts/scheduler_eod.py): run EOD snapshot daily at this time
eod_schedule_time: "20:00"   # 8pm
eod_schedule_tz: "America/New_York"

# Crypto section (BTC, ETH) - same signals as equities
crypto_watchlist:
  - BTC-USD
  - ETH-USD

# Cross-asset (DXY=USD, GLD=gold, USO=oil, VIX) - daily % change
cross_asset_tickers:
  - DX-Y.NYB
  - GLD
  - USO
  - SLV
  - "^VIX"

# Tax-aware exit optimizer: flag positions approaching 1-year (LTCG) threshold
# Add purchase_date (YYYY-MM-DD) to holdings in config or Excel upload to enable
# taxable_accounts: only show suggestions for these (e.g. Taxable); omit to include all
# Rates: federal + state (e.g. SC 7%). Short-term = ordinary income; long-term = cap gains
tax_aware_exit:
  taxable_accounts: ["Taxable"]   # or null to include all accounts
  st_fed_pct: 32
  st_state_pct: 7
  lt_fed_pct: 15
  lt_state_pct: 7
  approaching_days: 90   # flag when this many days or fewer until LTCG
