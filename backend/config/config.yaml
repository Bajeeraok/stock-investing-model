  evaluate_on_dashboard_refresh: true
  include_audit_cohort_on_refresh: true
  # Optional per-alert cooldown (minutes) for retail band/earnings/ML alerts — overrides scanner defaults
  retail_cooldown_min:
    EARNINGS_SOON: 360
    ENTRY_ZONE_ENTERED: 120
    STOP_HIT: 60
    TARGET_HIT: 120
    ML_PROB_CROSSED: 180
  # Daily digest: retail = story changes OR trim candidates OR earnings-week holdings; story_only = stories only
  digest_mode: retail
  web_push_enabled: true
  # P2: macro catalyst countdown push (CPI in 30m; gap-fade history 61%)
  catalyst_push_enabled: true
  # Scanner (Level-2): IV rank / flow / premium-selling surfacing — off by default; use band alerts below.
  enable_options_alerts: false
  # Separate process: alerts/worker.py Tradier IV snapshots + IV_EXTREME events (optional)
  enable_options_iv_worker: false
  # Retail: ST/MT/LT buy zone, stop, target hit, "near target — consider trim" (from ticker-detail band cache)
  enable_band_alerts: true
  enable_earnings_alerts: true
  enable_ml_prob_alerts: true
  # 3/4 gates + ST verdict supports add — alerts/UI only (does not change primary GO)
  enable_readiness_alerts: true
  enable_tactical_velocity_alerts: true
  tactical_min_gates: 2
