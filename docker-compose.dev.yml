# Stock Investing Model - Development (hot reload)
# Usage: docker compose -f docker-compose.dev.yml up --build
# Or with base file (redis + dev overrides): docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Backend: code changes auto-restart uvicorn
# Web: Next.js dev server hot-reloads on save

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - CORS_ORIGINS=http://localhost:3001,http://127.0.0.1:3001,http://web:3001
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    volumes:
      - ./backend:/app
    working_dir: /app
    # Watch only code dirs to avoid reload loop from data/ or __pycache__ writes
    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --reload
      - --reload-dir
      - /app/api
      - --reload-dir
      - /app/signals
      - --reload-dir
      - /app/config
      - --reload-dir
      - /app/behavior
      - --reload-dir
      - /app/alerts
      - --reload-dir
      - /app/opportunity
      - --reload-dir
      - /app/portfolio
      - --reload-exclude
      - "**/__pycache__/**"
    depends_on:
      - redis

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    environment:
      - BACKEND_API_URL=http://backend:8002
      - PORT=3001
      - WATCHPACK_POLLING=true
    volumes:
      - ./web:/app
      - /app/node_modules  # preserve container's node_modules (from npm ci)
    depends_on:
      - backend

volumes:
  redis_data:
